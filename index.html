function scene(index,phase){

 const url='wonder-page-'+slot+'.webp';
 art.style.setProperty('--picture','url("'+url+'")');
 if(art.dataset.slot===String(slot))return;
 art.dataset.slot=slot;
 const picture=new Image();
 picture.src=url;
 picture.alt='';
 art.replaceChildren(picture);
}

 actions.forEach(([name,action],i)=>{const b=document.createElement('button');b.textContent=name;if(actions.length===1||phase==='class'&&i===0)b.className='primary';b.onclick=action;panel.lastElementChild.append(b)});
 document.getElementById('status').textContent=phase==='cover'?'เวลาเล่นประมาณ 5–10 นาที':('ผ่านแล้ว '+journey.length+' / 5 ประตู');
 document.querySelector('.trail').innerHTML=range(5,i=>'<i class="'+(i<journey.length?'on':'')+'"></i>');
 panel.querySelector('h1').focus({preventScroll:true});window.scrollTo(0,0);
}
const p=s=>'<p>'+s+'</p>',q=s=>'<p class="quote">'+s+'</p>';
function start(){
 journey=[]; chapter=0;
 screen('บทนำ · โพรงกระต่าย','English in<br><i>Wonderverse</i>',
 p('ติ๊ก ต๊อก ติ๊ก ต๊อก… เสียงดังมาจากหนังสือภาษาอังกฤษบนโต๊ะเรียนของคุณ พอคุณเปิดปก กระต่ายขาวสวมเสื้อกั๊กก็โผล่หัวออกมา ด้ายสีทองเส้นหนึ่งพันอยู่รอบอุ้งเท้าของมัน')+
 q('“แย่แล้ว! หน้าหนังสือของฉันปลิวเข้าไปในประตูทั้งห้าบาน ช่วยฉันเก็บให้ครบก่อนเสียงกริ่งนะ แล้วเราจะเปิดหน้าลับดูด้วยกันว่าของวิเศษชิ้นไหนเลือกเธอ”'),
 [['ตามกระต่ายลงไปในหนังสือ',enter]],'cover')
}
function enter(){
 const d=doors[chapter];
 screen('ประตูบานที่ '+(chapter+1)+' · '+d.en,d.th,p(d.story)+p(d.invite)+q(d.quote),
 d.options.map((s,i)=>[s,()=>reveal(i)]))
}
function reveal(i){
 first=i;const d=doors[chapter];
 screen('ประตูบานที่ '+(chapter+1),['เสียงจากหน้าถัดไป','แขกหายไปครึ่งงาน','เมื่อลูกค้าใหม่มาถึง','คุณยายเปิดประตู','เสียงเคาะจากอีกฝั่ง'][chapter],
 p(d.early[i])+p(d.twist)+q('กระต่ายกระซิบถาม “พอรู้เรื่องนี้แล้ว ยังอยากทำแบบเดิมไหม”'),
 [['ทำแบบเดิม · '+d.options[i],()=>finish(i)],['ขอเลือกอีกครั้ง',rechoose]])
}
function rechoose(){
 const d=doors[chapter];screen('ประตูบานที่ '+(chapter+1), 'คราวนี้คุณจะทำอย่างไร',p(d.twist),
 d.options.map((s,i)=>[s,()=>finish(i)]))
}
function finish(i){
 const d=doors[chapter]; journey.push({first,last:i});
 screen('สมุดของกระต่าย · หน้า '+journey.length,d.th,p(d.end[i])+q(d.page),
 [[chapter===4?'เปิดสมุดของกระต่าย':'ตามกระต่ายไปประตูถัดไป',()=>{if(chapter===4)book();else{chapter++;enter()}}]])
}
function book(){
 screen('สมุดของกระต่าย','The Book of Choices',
 p('กระต่ายร้อยด้ายสีทองเข้าเข็ม แล้วเย็บหน้าหนังสือทั้งห้ากลับเข้าด้วยกัน “ลองเปิดดูสิ เรื่องที่อยู่ในเล่มนี้เป็นเรื่องของเธอด้วยนะ”')+
 journey.map(({first,last},i)=>'<details class="page"><summary>หน้า '+(i+1)+' · '+doors[i].th+'</summary>'+p('ตอนแรก คุณเลือก “'+doors[i].options[first]+'”')+p(first===last?'พอรู้เรื่องเพิ่ม คุณก็ยังเลือกทางเดิม':'พอรู้เรื่องเพิ่ม คุณเปลี่ยนใจ “'+doors[i].options[last]+'”')+p(doors[i].end[last])+'</details>').join(''),
 [['เปิดหน้าลับ ดูของวิเศษของฉัน',fortune]],'book')
}
// Each tag describes the visible action. Choosing either announcer alone
// gives too little evidence about why the player chose that speaker.
const giftTags=[
 ['quill','lamp','compass'],
 [null,null,'compass'],
 ['compass','lamp','compass'],
 ['compass','lamp','lamp'],
 ['quill','compass','compass']
];
const gifts={
 quill:['🪶','ปากกาขนนกของบรรณาธิการ','วันไหนที่เพื่อนเขียนจดหมายสำคัญ เขาอาจเลื่อนกระดาษมาให้เธอ แล้วกระซิบว่า “ช่วยดูคำนี้อีกทีได้ไหม”'],
 lamp:['🏮','โคมไฟของนักเล่าเรื่อง','วันไหนที่เพื่อนหาคำอังกฤษมาเล่าเรื่องที่บ้านไม่เจอ เธออาจเป็นคนที่ถามว่า “ที่บ้านเรียกมันว่าอะไรเหรอ เล่าให้ฟังหน่อยสิ”'],
 compass:['🧭','เข็มทิศของนักเดินทาง','วันไหนที่เพื่อนถือแผนที่กลับหัว เธออาจลองไปยืนข้างเขา แล้วพบว่าบอกทางอีกแบบจะเข้าใจง่ายขึ้น']
};
function readGift(trail){
 const votes={quill:0,lamp:0,compass:0};
 const tags=trail.map(({last},i)=>giftTags[i][last]);
 for(const tag of tags)if(tag)votes[tag]++;
 const highest=Math.max(...Object.values(votes));
 // When tied, let the most recent supporting door supply the example.
 const door=tags.map(tag=>Boolean(tag && votes[tag]===highest)).lastIndexOf(true);
 return {door,tag:tags[door]};
}
function fortune(){
 const {door,tag}=readGift(journey);
 const [icon,name,prediction]=gifts[tag];
 const evidence=doors[door].options[journey[door].last];
 const changed=journey.findIndex(({first,last})=>first!==last);
 let memory='';
 if(changed>=0){
   const d=doors[changed],choice=journey[changed];
   memory=p('ที่'+d.th+' ตอนแรกคุณเลือก “'+d.options[choice.first]+'” พอรู้เรื่องอีกด้าน คุณเปลี่ยนมาเลือก “'+d.options[choice.last]+'”');
 }
 screen('หน้าลับ · คำทำนายของกระต่าย',name,
 p('<span aria-hidden="true" style="font-size:2.5rem">'+icon+'</span>')+
 p('ด้ายสีทองลากผ่านหน้าที่ '+(door+1)+' แล้วหยุดตรงบรรทัดที่คุณเลือก “'+evidence+'” กระต่ายล้วงมือเข้าไปในภาพ แล้วหยิบของวิเศษออกมาวางบนฝ่ามือคุณ')+
 q('กระต่ายทายว่า “'+prediction+'”')+memory,
 [['พาของวิเศษกลับห้องเรียน',ending]],'book')
}
function ending(){
 screen('บทส่งท้าย','กลับมาทันเสียงกริ่ง',
 p('กริ๊ง! คุณเงยหน้าขึ้น คุณครูกำลังเขียนคำว่า Good English บนกระดาน หนังสือบนโต๊ะปิดสนิท แต่ตรงมุมสมุดมีรอยเท้ากระต่ายเล็ก ๆ อยู่ห้ารอย')+
 q('คุณครูหันมายิ้ม “ถ้าเพื่อนถามว่าภาษาอังกฤษแบบไหนเรียกว่าใช้ได้ดี เธอจะเล่าเรื่องจากประตูบานไหนให้เพื่อนฟัง เพราะอะไรจ๊ะ”')+
 p('ลองนึกคำตอบในใจ หรือหันไปเล่าให้เพื่อนฟังสักประโยคก็ได้'),
 [['เปิดสมุดอ่านอีกครั้ง',book],['เริ่มนิทานใหม่',start]],'class')
}
start();
</script></html>
