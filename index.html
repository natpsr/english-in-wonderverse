{en:'The Queen of Perfect English',th:'ราชินีแห่งเสียงอันสมบูรณ์',obj:'♛',hue:'#9c727f',story:'ในท้องพระโรง ราชินีกำลังเลือกผู้ประกาศงานเลี้ยง คนหนึ่งมาจากลอนดอน อีกคนเป็นช่างทำนาฬิกาชาวไทยที่รู้จักแขกทุกโต๊ะ ทั้งสองอ่านประกาศได้คล่อง ราชินีส่งมงกุฎผู้ประกาศให้คุณเป็นคนเลือก',quote:'“Meet by the west gate when the clock strikes six.”',options:['มอบมงกุฎให้ผู้ประกาศจากลอนดอน','มอบมงกุฎให้ช่างนาฬิกาที่คุ้นกับแขก','ให้ทั้งคู่ลองประกาศ แล้วฟังว่าแขกไปถูกประตูไหม'],early:['ผู้ประกาศโค้งรับมงกุฎและเดินขึ้นแท่นหิน','ช่างนาฬิกาไขลานไมโครโฟนแล้วเรียกทุกโต๊ะให้เงียบ','ทั้งสองผลัดกันประกาศ แต่แขกกลับเดินแยกเป็นสองแถว'],twist:'ประตูตะวันตกมีสองบาน! แขกเรียกบานเก่าว่า “ประตูเห็ด” ส่วนราชินีเพิ่งเปลี่ยนชื่ออีกบาน ไม่มีสำเนียงไหนช่วยบอกได้ว่าต้องไปบานใด หากผู้ประกาศยังถือแผนที่คนละฉบับ',end:['ผู้ประกาศจากลอนดอนขอแผนที่จากราชินี แล้วเพิ่มสีของบานประตูลงในประกาศ','ช่างนาฬิกาใช้ชื่อเล่นของประตู แขกประจำพาแขกหน้าใหม่เดินตาม','ผู้ประกาศทั้งสองลองบอกทางกับแขกคนละโต๊ะ แล้วปรับประกาศจากสิ่งที่แขกได้ยิน']},
{en:'The Mixed-Language Market',th:'ตลาดถ้อยคำสลับภาษา',obj:'☕',hue:'#ab805d',story:'แผงชาของกระต่ายขาวมีลูกค้าต่อคิวยาว ป้าย “Cha Yen” ทำให้นักเดินทางคนหนึ่งนึกว่าเป็นชื่อเจ้าของร้าน แม่ค้าส่งชอล์กให้คุณ “ช่วยเขียนป้ายใหม่ก่อนน้ำแข็งละลายได้ไหม”',quote:'Cha Yen · ชาเย็น · 35 baht',options:['เขียน “Thai iced tea” ให้เห็นชัดจากท้ายแถว','เก็บ “ชาเย็น / Cha Yen” แล้วเติมคำอธิบายภาษาอังกฤษ','วาดแก้วชาสีส้ม ใส่ราคา แล้วชวนลูกค้าชี้สั่ง'],early:['นักเดินทางอ่านป้ายภาษาอังกฤษแล้วขยับเข้ามาใกล้','แม่ค้าลองออกเสียงชื่อชาพร้อมกับลูกค้า','คนท้ายแถวยกนิ้วชี้รูปแก้ว เป็นสัญญาณสั่งชาแก้วแรก'],twist:'เรือเที่ยวใหม่มาถึง ลูกค้ากลุ่มนี้อ่านทั้งไทยและอังกฤษได้น้อย คนหนึ่งยกขวดนมขึ้นแล้วส่ายหน้า แม่ค้ามีทั้งชานมและชาดำ แต่ในรูปทั้งสองแก้วดูคล้ายกัน',end:['ลูกค้าชี้คำว่า tea แม่ค้าจึงยกเหยือกทั้งสองใบมาให้ดูใกล้ ๆ','ลูกค้าจำเสียง “ชาเย็น” ได้ แม่ค้าชูขวดนมถามอีกครั้งก่อนริน','ลูกค้าชี้รูปแล้วชี้ขวดนม แม่ค้าวาดรูปหยดนมเพิ่มข้างแก้วที่ใส่นม']},

 panel.replaceChildren();panel.className='content';void panel.offsetWidth;panel.classList.add('in');
 panel.innerHTML='<div class="eyebrow">'+label+'</div><h1 tabindex="-1">'+title+'</h1>'+body+'<div class="buttons"></div>';
 actions.forEach(([name,action],i)=>{const b=document.createElement('button');b.textContent=name;if(actions.length===1||phase==='class'&&i===0)b.className='primary';b.onclick=action;panel.lastElementChild.append(b)});
 document.getElementById('status').textContent=phase==='cover'?'เวลาเล่นประมาณ 5–10 นาที':('ผ่านแล้ว '+journey.length+' / 5 ประตู');
 document.querySelector('.trail').innerHTML=range(5,i=>'<i class="'+(i<journey.length?'on':'')+'"></i>');
 panel.querySelector('h1').focus({preventScroll:true});window.scrollTo(0,0);
}
const p=s=>'<p>'+s+'</p>',q=s=>'<p class="quote">'+s+'</p>';
function start(){journey=[];chapter=0;screen('THE RABBIT HOLE','English in<br><i>Wonderverse</i>',p('ปลายคาบภาษาอังกฤษ หนังสือ <i>The Rules of English</i> บนโต๊ะของคุณเปิดเอง กระต่ายตัวเล็กโผล่หูขึ้นมาจากรอยพับ แล้วคว้านาฬิกาที่กำลังเดินถอยหลัง')+q('“ถ้าอยากกลับให้ทันเสียงกริ่ง ช่วยฉันหาหน้าหนังสือที่หายไปทั้งห้าหน้าที!”'),[['กระโดดลงไปในหน้าหนังสือ',enter]],'cover')}
function enter(){const d=doors[chapter];screen('DOOR 0'+(chapter+1)+' / 05 · '+d.en,d.th,p(d.story)+q(d.quote),d.options.map((s,i)=>[s,()=>reveal(i)]))}
function reveal(i){first=i;const d=doors[chapter];screen('PLOT TWIST · '+d.en,'อีกด้านของเรื่อง',p(d.early[i])+q(d.twist),[['ยืนยันทางเดิม · '+d.options[i],()=>finish(i)],['ลองเลือกทางอื่น',rechoose]])}
function rechoose(){const d=doors[chapter];screen('SECOND CHOICE · '+d.en,'เมื่อรู้เรื่องอีกด้าน…',p(d.twist)+p('ตอนแรกคุณเลือก “'+d.options[first]+'”'),d.options.map((s,i)=>[s,()=>finish(i)]))}
function finish(i){const d=doors[chapter];journey.push({first,last:i});screen('THE BOOK OF CHOICES · หน้า '+journey.length,'หน้าที่หายไปกลับมาแล้ว',p(d.end[i])+q('ตัวอักษรบนหน้าหนังสือเรียงตัวเป็นข้อความของคุณ “'+d.options[i]+'”'),[[chapter===4?'เปิด The Book of Choices':'เปิดประตูถัดไป',()=>{if(chapter===4)book();else{chapter++;enter()}}]])}
function book(){screen('FIVE PAGES · ONE JOURNEY','The Book of Choices',p('กระต่ายเย็บหน้าทั้งห้าเข้าด้วยกันด้วยด้ายสีทอง ลองพลิกดูว่าเรื่องของคุณเปลี่ยนตรงไหนบ้าง')+journey.map(({first,last},i)=>'<details class="page"><summary>หน้า '+(i+1)+' · '+doors[i].th+'</summary>'+p('แรกเลือก · '+doors[i].options[first])+p((first===last?'ยืนยัน · ':'เปลี่ยนเป็น · ')+doors[i].options[last])+p(doors[i].end[last])+'</details>').join(''),[['ก้าวผ่านหน้าสุดท้ายกลับห้องเรียน',ending]],'book')}
function ending(){screen('BACK TO CLASS','เสียงกริ่งดังพอดี',p('คุณลืมตาที่โต๊ะตัวเดิม อาจารย์เพิ่งเขียนคำว่า “Good English” บนกระดาน ตรงมุมสมุดมีรอยเท้ากระต่ายเล็ก ๆ ห้ารอย คราวนี้คุณมีเรื่องจะเล่าให้เพื่อนฟัง')+q('หลังจากเดินทางผ่านทั้ง 5 ประตู คุณคิดว่าภาษาอังกฤษที่ “ดี” หรือ “ถูกต้อง” ควรตัดสินจากอะไร เพราะอะไร?')+p('ลองตอบในใจหรือเล่าให้เพื่อนฟังสัก 1–2 ประโยค'),[['ย้อนอ่านสมุดของฉัน',book],['เริ่มผจญภัยรอบใหม่',start]],'class')}
start();
</script></html>
